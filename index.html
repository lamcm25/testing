<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學人文科學學習夥伴</title>
  <style>
    body { background-color: #1a202c; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
    .card { max-width: 400px; margin: auto; background: #2d3748; padding: 20px; border-radius: 20px; }
    .avatar-container { width: 250px; height: 250px; margin: auto; border-radius: 20px; overflow: hidden; border: 3px solid #63b3ed; }
    img, video { width: 100%; height: 100%; object-fit: cover; }
    .btn { background: #38a169; color: white; padding: 12px 24px; border: none; border-radius: 30px; font-size: 16px; cursor: pointer; margin: 15px 0; }
    .input-box { display: flex; gap: 10px; margin-top: 10px; }
    input { flex: 1; padding: 10px; border-radius: 10px; border: none; }
    button.send { background: #3182ce; color: white; border: none; padding: 10px 15px; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>小學人文科學學習夥伴</h2>
    
    <div class="avatar-container">
      <img id="avatar-img" src="avatar.png" alt="Avatar">
      <video id="avatar-video" style="display:none;" autoplay playsinline></video>
    </div>

    <button class="btn" onclick="recordAndAsk()">🎤 按此語音發問</button>

    <div class="input-box">
      <input type="text" id="text-input" placeholder="或在此打字發問..." onkeypress="handleKeyPress(event)">
      <button class="send" onclick="sendTextQuery()">傳送</button>
    </div>

    <p id="status" style="margin-top: 15px; font-size: 14px; color: #cbd5e0;"></p>
  </div>

  <script>
    async function sendQueryToBackend(studentQuery) {
      if (!studentQuery.trim()) return;

      const imgEl = document.getElementById('avatar-img');
      const videoEl = document.getElementById('avatar-video');
      
      document.getElementById('status').innerText = "AI 正在思考並生成動畫語音...";

      try {
        const response = await fetch('https://hk-primary-tutor-backend.onrender.com/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: studentQuery })
        });

        const data = await response.json();
        document.getElementById('status').innerText = data.text || "";

        if (data.video_url) {
          imgEl.style.display = 'none';
          videoEl.style.display = 'block';
          videoEl.src = data.video_url;
          videoEl.play();

          videoEl.onended = () => {
            videoEl.style.display = 'none';
            imgEl.style.display = 'block';
          };
        }
      } catch (error) {
        document.getElementById('status').innerText = "連線失敗，請確認 Server 狀態。";
      }
    }

    function recordAndAsk() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'zh-HK';
      recognition.start();

      document.getElementById('status').innerText = "正在聆聽你的問題...";

      recognition.onresult = (event) => {
        sendQueryToBackend(event.results[0][0].transcript);
      };
    }

    function sendTextQuery() {
      const inputField = document.getElementById('text-input');
      sendQueryToBackend(inputField.value);
      inputField.value = '';
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') sendTextQuery();
    }
  </script>
</body>
</html>
