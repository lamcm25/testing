<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學人文科 AI 導師</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      color: #e2e8f0;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Uses your inno.jpeg file as the background image */
      background: url('inno.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    .app-card {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
      border-radius: 28px;
      padding: 30px 20px;
      max-width: 460px;
      width: 90%;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 18px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    #avatar-box {
      width: 280px;
      height: 280px;
      margin: 0 auto 18px;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      background: #0f172a;
    }

    #avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top; /* Focuses on the head and face */
    }

    .mic-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }

    .mic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .input-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      max-width: 400px;
      margin: 0 auto;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      outline: none;
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
    }

    input[type="text"]::placeholder {
      color: #94a3b8;
    }

    .send-btn {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }

    #status {
      margin-top: 18px;
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h1>小學人文科學習夥伴</h1>

    <div id="avatar-box">
      <img id="avatar-img" src="avatar.png" alt="Cartoon Tutor">
    </div>

    <button class="mic-btn" onclick="recordAndAsk()">🎤 按此語音發問</button>
    
    <div class="input-container">
      <input type="text" id="text-input" placeholder="或在此打字發問..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendTextQuery()">傳送</button>
    </div>

    <p id="status">按下語音按鈕發問，或者直接打字都得！</p>
  </div>

  <script>
    async function sendQueryToBackend(studentQuery) {
      if (!studentQuery.trim()) return;

      document.getElementById('status').innerText = "思考中: " + studentQuery;

      try {
        const response = await fetch('https://hk-primary-tutor-backend.onrender.com/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: studentQuery })
        });

        const data = await response.json();
        document.getElementById('status').innerText = data.text;
      } catch (error) {
        document.getElementById('status').innerText = "連線失敗，請確認後端 Server 是否正常運作。";
      }
    }

    function recordAndAsk() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'zh-HK';
      recognition.start();

      document.getElementById('status').innerText = "正在聆聽你的問題...";

      recognition.onresult = (event) => {
        const studentQuery = event.results[0][0].transcript;
        sendQueryToBackend(studentQuery);
      };
    }

    function sendTextQuery() {
      const inputField = document.getElementById('text-input');
      const query = inputField.value;
      inputField.value = '';
      sendQueryToBackend(query);
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendTextQuery();
      }
    }
  </script>
</body>
</html>
