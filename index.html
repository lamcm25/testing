<script>
  const imgEl = document.getElementById('avatar-img');
  const videoEl = document.getElementById('avatar-video');
  const statusEl = document.getElementById('status');

  function playVideoIfBlocked() {
    if (videoEl.style.display === 'block' && videoEl.paused) {
      videoEl.play().catch(err => console.log("Click play failed:", err));
    }
  }

  async function sendQueryToBackend(studentQuery) {
    if (!studentQuery.trim()) return;

    statusEl.innerText = "AI 正在思考中...";

    try {
      const response = await fetch('https://hk-primary-tutor-backend.onrender.com/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: studentQuery })
      });

      const data = await response.json();
      const replyText = data.text || "";
      statusEl.innerText = replyText;
      statusEl.dataset.replyText = replyText;

      if (data.talk_id) {
        statusEl.innerText = replyText + "\n(🎬 動畫生成中...)";
        pollForVideo(data.talk_id);
      }
    } catch (error) {
      console.error("Fetch error:", error);
      statusEl.innerText = "連線失敗，請稍後再試。";
    }
  }

  async function pollForVideo(talkId) {
    let attempts = 0;
    const maxAttempts = 40; // 40 attempts x 3s = 120s total polling window

    const interval = setInterval(async () => {
      attempts++;
      if (attempts > maxAttempts) {
        clearInterval(interval);
        statusEl.innerText = statusEl.dataset.replyText + " (影片生成超時，請稍後刷新頁面)";
        return;
      }

      try {
        const res = await fetch(`https://hk-primary-tutor-backend.onrender.com/api/status/${talkId}`);
        const statusData = await res.json();

        if (statusData.status === 'done' && statusData.video_url) {
          clearInterval(interval);
          statusEl.innerText = statusEl.dataset.replyText;
          playVideo(statusData.video_url);
        } else if (statusData.status === 'error') {
          clearInterval(interval);
          console.error("D-ID Error:", statusData.error);
          statusEl.innerText = statusEl.dataset.replyText + " (影片生成錯誤)";
        }
      } catch (err) {
        console.error("Polling error:", err);
      }
    }, 3000); // Check status every 3 seconds
  }

  function playVideo(videoUrl) {
    imgEl.style.display = 'none';
    videoEl.style.display = 'block';
    videoEl.src = videoUrl;
    videoEl.currentTime = 0;
    videoEl.muted = false;

    videoEl.play().catch(e => {
      console.log("Autoplay blocked:", e);
      statusEl.innerText = statusEl.dataset.replyText + "\n(🔊 請按一下頭像播放聲音影片)";
    });

    videoEl.onended = () => {
      videoEl.style.display = 'none';
      imgEl.style.display = 'block';
    };

    videoEl.onerror = (err) => {
      console.error("Video load error:", err);
      videoEl.style.display = 'none';
      imgEl.style.display = 'block';
    };
  }

  function recordAndAsk() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("你的瀏覽器不支援語音輸入，請直接打字。");
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    recognition.start();

    statusEl.innerText = "正在聆聽你的問題...";

    recognition.onresult = (event) => {
      sendQueryToBackend(event.results[0][0].transcript);
    };
  }

  function sendTextQuery() {
    const inputField = document.getElementById('text-input');
    sendQueryToBackend(inputField.value);
    inputField.value = '';
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') sendTextQuery();
  }
</script>
