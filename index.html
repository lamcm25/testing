<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學人文科學學習夥伴</title>
  <style>
    body { 
      background: url('inno.jpeg') no-repeat center center fixed; 
      background-size: cover; 
      color: white; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      text-align: center; 
      padding: 20px; 
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card { 
      width: 100%;
      max-width: 420px; 
      background: rgba(30, 41, 59, 0.88); 
      backdrop-filter: blur(12px);
      padding: 24px; 
      border-radius: 24px; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h2 { margin-top: 0; color: #63b3ed; font-size: 22px; }
    .avatar-container { 
      width: 280px; 
      height: 280px; 
      margin: 15px auto; 
      border-radius: 20px; 
      overflow: hidden; 
      border: 3px solid #63b3ed; 
      background: #1a202c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    img, video { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
    }
    .btn { 
      background: #38a169; 
      color: white; 
      padding: 12px 24px; 
      border: none; 
      border-radius: 30px; 
      font-size: 16px; 
      font-weight: bold;
      cursor: pointer; 
      margin: 15px 0; 
      transition: background 0.2s;
    }
    .btn:hover { background: #2f855a; }
    .input-box { display: flex; gap: 8px; margin-top: 10px; }
    input { 
      flex: 1; 
      padding: 12px; 
      border-radius: 12px; 
      border: 1px solid #4a5568; 
      background: #1a202c;
      color: white;
      font-size: 15px;
    }
    button.send { 
      background: #3182ce; 
      color: white; 
      border: none; 
      padding: 12px 20px; 
      border-radius: 12px; 
      font-weight: bold;
      cursor: pointer;
    }
    #status { margin-top: 15px; font-size: 14px; color: #cbd5e0; min-height: 40px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="card">
    <h2>小學人文科學學習夥伴</h2>
    
    <div class="avatar-container" onclick="playVideoIfBlocked()">
      <img id="avatar-img" src="avatar2.png" alt="Avatar">
      <video id="avatar-video" style="display:none;" playsinline webkit-playsinline></video>
    </div>

    <button class="btn" onclick="recordAndAsk()">🎤 按此語音發問</button>

    <div class="input-box">
      <input type="text" id="text-input" placeholder="或在此打字發問..." onkeypress="handleKeyPress(event)">
      <button class="send" onclick="sendTextQuery()">傳送</button>
    </div>

    <p id="status">Hi! 你好呀！有咩問題想問我呢？</p>
  </div>

  <script>
    const imgEl = document.getElementById('avatar-img');
    const videoEl = document.getElementById('avatar-video');
    const statusEl = document.getElementById('status');

    function playVideoIfBlocked() {
      if (videoEl.style.display === 'block' && videoEl.paused) {
        videoEl.play().catch(err => console.log("Click play failed:", err));
      }
    }

    async function sendQueryToBackend(studentQuery) {
      if (!studentQuery.trim()) return;

      statusEl.innerText = "AI 正在思考中...";

      try {
        const response = await fetch('https://hk-primary-tutor-backend.onrender.com/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: studentQuery })
        });

        const data = await response.json();
        const replyText = data.text || "";
        statusEl.innerText = replyText;
        statusEl.dataset.replyText = replyText;

        if (data.talk_id) {
          statusEl.innerText = replyText + "\n(🎬 動畫生成中...)";
          pollForVideo(data.talk_id);
        }
      } catch (error) {
        console.error("Fetch error:", error);
        statusEl.innerText = "連線失敗，請稍後再試。";
      }
    }

    async function pollForVideo(talkId) {
      let attempts = 0;
      const maxAttempts = 30;

      const interval = setInterval(async () => {
        attempts++;
        if (attempts > maxAttempts) {
          clearInterval(interval);
          statusEl.innerText = statusEl.dataset.replyText + " (影片生成超時)";
          return;
        }

        try {
          const res = await fetch(`https://hk-primary-tutor-backend.onrender.com/api/status/${talkId}`);
          const statusData = await res.json();

          if (statusData.status === 'done' && statusData.video_url) {
            clearInterval(interval);
            statusEl.innerText = statusEl.dataset.replyText;
            playVideo(statusData.video_url);
          } else if (statusData.status === 'error') {
            clearInterval(interval);
            console.error("D-ID Error:", statusData.error);
            statusEl.innerText = statusEl.dataset.replyText + " (影片生成錯誤，請確認 Voice ID)";
          }
        } catch (err) {
          console.error("Polling error:", err);
        }
      }, 2000);
    }

    function playVideo(videoUrl) {
      imgEl.style.display = 'none';
      videoEl.style.display = 'block';
      videoEl.src = videoUrl;
      videoEl.currentTime = 0;
      videoEl.muted = false;

      videoEl.play().catch(e => {
        console.log("Autoplay blocked:", e);
        statusEl.innerText = statusEl.dataset.replyText + "\n(🔊 請按一下頭像播放聲音影片)";
      });

      videoEl.onended = () => {
        videoEl.style.display = 'none';
        imgEl.style.display = 'block';
      };

      videoEl.onerror = (err) => {
        console.error("Video load error:", err);
        videoEl.style.display = 'none';
        imgEl.style.display = 'block';
      };
    }

    function recordAndAsk() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("你的瀏覽器不支援語音輸入，請直接打字。");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-HK';
      recognition.start();

      statusEl.innerText = "正在聆聽你的問題...";

      recognition.onresult = (event) => {
        sendQueryToBackend(event.results[0][0].transcript);
      };
    }

    function sendTextQuery() {
      const inputField = document.getElementById('text-input');
      sendQueryToBackend(inputField.value);
      inputField.value = '';
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') sendTextQuery();
    }
  </script>
</body>
</html>
